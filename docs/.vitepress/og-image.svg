<!--
  Source of docs/public/og-choliba.png, the image of every page's share card: 1200×630 (1.91:1), under 600 KB.
  Same look as the home hero (dark background, gradient name, owl with amber glow). After changing it, make the PNG with
  inkscape docs/.vitepress/og-image.svg -o docs/public/og-choliba.png -w 1200 -h 630
  The owl is the one of docs/public/owl-logo-choliba.svg.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="name" gradientUnits="userSpaceOnUse" x1="80" y1="0" x2="520" y2="0">
      <stop offset="0.3" stop-color="#8FD1BE"/>
      <stop offset="1" stop-color="#E3AE45"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#D99B26" stop-opacity="0.75"/>
      <stop offset="0.55" stop-color="#D99B26" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#D99B26" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="#212121"/>
  <circle cx="900" cy="315" r="330" fill="url(#glow)"/>
  <g transform="translate(720 105) scale(0.82)">
    <path fill="#1A3B34" d="M256 32 L392 96 L432 208 C432 352 352 464 256 480 C160 464 80 352 80 208 L120 96 Z"/>
    <polygon fill="#122A25" points="120,96 256,176 80,208"/>
    <polygon fill="#122A25" points="392,96 256,176 432,208"/>
    <circle cx="176" cy="240" r="88" fill="#F4EFE6"/>
    <circle cx="336" cy="240" r="88" fill="#F4EFE6"/>
    <circle cx="176" cy="240" r="56" fill="#D99B26"/>
    <circle cx="336" cy="240" r="56" fill="#D99B26"/>
    <circle cx="176" cy="240" r="32" fill="#111B18"/>
    <circle cx="336" cy="240" r="32" fill="#111B18"/>
    <circle cx="160" cy="224" r="10" fill="#FFFFFF"/>
    <circle cx="320" cy="224" r="10" fill="#FFFFFF"/>
    <polygon fill="#111B18" points="256,220 236,280 256,310 276,280"/>
    <polygon fill="#F4EFE6" points="256,320 160,380 256,460 352,380"/>
    <polygon fill="#D99B26" points="256,350 210,390 256,430 302,390"/>
  </g>
  <g font-family="Inter, Noto Sans, DejaVu Sans, sans-serif">
    <text x="76" y="225" font-size="150" font-weight="700" fill="url(#name)">Choliba</text>
    <text x="80" y="317" font-size="52" font-weight="700" fill="#F2EEE6">Agentes de código,</text>
    <text x="80" y="381" font-size="52" font-weight="700" fill="#F2EEE6">sempre numa sandbox</text>
    <text x="80" y="450" font-size="28" fill="#9A9A9A">Claude Code, Codex, Cursor e modelos locais</text>
    <text x="80" y="490" font-size="28" fill="#9A9A9A">pelo Ollama, a partir de scripts TypeScript.</text>
    <text x="80" y="560" font-size="24" fill="#8FD1BE">choliba.github.io</text>
  </g>
</svg>
