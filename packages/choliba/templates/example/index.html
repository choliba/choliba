<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <title>Loja de exemplo</title>
  </head>
  <body>
    <h1>Loja de exemplo</h1>
    <p>Receba as novidades da loja por e-mail.</p>
    <form id="newsletter">
      <label for="email">E-mail</label>
      <input id="email" name="email" type="email" required />
      <button type="submit">Assinar</button>
    </form>
    <p id="mensagem" role="status"></p>
    <script>
      document.getElementById('newsletter').addEventListener('submit', (event) => {
        event.preventDefault();
        document.getElementById('mensagem').textContent = 'Obrigado por assinar!';
      });
    </script>
  </body>
</html>
