version: 1

agent:
  id: with-prepare
  name: With Prepare
  version: 1.0.0
  description: Fixture agent with a git_diff before and a record_git_head after.

models:
  - claude-3-5-sonnet

role: |
  Fixture agent with prepare hooks — used only in package tests.
context:
  - O comando prepara diff e snapshot antes de invocar o agente.
input: |
  Recebe diff e snapshots no prompt.
flow: |
  1. Leia o diff entregue.
output: |
  Devolve um resumo das alterações.
notes:
  - Fixture de teste.

permissions:
  allow:
    write: [docs/]
  deny:
    write: [agents/]

task:
  required: false
  default: Atualize a documentação com base no contexto entregue.

steps:
  execute:
    before:
      - git_diff: [develop, .cache/with-prepare/diff.patch, --pending, .cache/with-prepare/last-base]
      - add_files: [documentacao_atual, 'docs/**/*.md']
      - add_files: [readme_atual, README.md]
    after:
      success:
        - record_git_head: [.cache/with-prepare/last-base]
