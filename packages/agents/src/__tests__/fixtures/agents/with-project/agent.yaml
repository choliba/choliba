version: 1

agent:
  id: with-project
  name: With Project
  version: 1.0.0
  description: Fixture agent that acts on one project, given by --project.

models:
  - claude-3-5-sonnet

role: |
  Fixture de teste: age sobre ${PROJECT}, em ${PROJECT_DIR}, cuja aplicação fica em ${APP_DIR}.
context:
  - Nada.
input: |
  Qualquer texto.
flow: |
  1. Nada.
output: |
  Nada.
notes:
  - Fixture de teste.

permissions:
  allow:
    read: ['${PROJECT_DIR}/config.json', '${APP_DIR}/']
    write: ['${PROJECT_DIR}/tickets/']
  deny:
    write: [agents/]

task:
  required: false
  default: Trabalhe no projeto.
