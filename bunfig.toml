# Cobertura dos testes (bun run test:cov). O Bun só mede e escreve o lcov; os
# limites (que só sobem) ficam em coverage-thresholds.json, conferidos pelo
# scripts/coverage-ratchet.ts. Sem coverageThreshold aqui: o do Bun vale para
# cada arquivo, não para o total. Veja .agents/skills/coverage-ratchet.
[test]
# The developer's CHOLIBA_* variables (.env) do not reach the tests.
preload = ["./test/support/env.ts"]
coverageReporter = ["text", "lcov"]
coverageDir = "coverage"
coverageSkipTestFiles = true
# Fora da conta: o que não é o produto. Os testes e o que eles criam em
# pastas temporárias, os exemplos (guides/), as ferramentas dos agentes do
# projeto (tools/) e os arquivos de configuração do projeto.
coveragePathIgnorePatterns = [
  "../**",
  "test/**",
  "tools/**",
  "guides/**",
  "config/**",
  "choliba.config.ts",
]
