name: Erro de execução de agente
description: Uma ocorrência de erro numa execução de agente. Uma issue por erro.
title: '[execution-error] '
labels: ['execution-error', 'bug']
body:
  - type: markdown
    attributes:
      value: >-
        Uma issue por erro. Não cole tokens, credenciais, o `.env`, prompts nem dados pessoais. Para algo que não é uma
        execução de agente, use o template "Relatar um bug".
  - type: input
    id: session
    attributes:
      label: Sessão
      description: >-
        O log da sessão (JSONL), na pasta `logger.dir` do `choliba.config.ts` (`.choliba/logs` por padrão), relativo à
        raiz do projeto.
      placeholder: .choliba/logs/2026-11-25T10-00-00.000Z.jsonl
  - type: dropdown
    id: stage
    attributes:
      label: Onde falhou
      options:
        - ao criar o agente (opção ou política recusada)
        - workspace (bubblewrap ou Docker)
        - provider (a CLI do agente)
        - gate de execução (comando negado ou pendente)
        - rede (destino negado)
        - ferramenta do projeto (mcp)
        - conversa (terminal, tela cheia ou arquivo)
        - rodada (critério ou limite)
        - não sei
    validations:
      required: true
  - type: input
    id: provider
    attributes:
      label: Provider e modelo
      placeholder: codex · gpt-6.1-sol
    validations:
      required: true
  - type: dropdown
    id: workspace
    attributes:
      label: Workspace
      options:
        - bubblewrap
        - docker
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Versão do choliba
      description: O `version` do `package.json` instalado (`bun pm ls choliba`) ou, no código-fonte, `git rev-parse --short HEAD`.
      placeholder: 0.3.0
    validations:
      required: true
  - type: input
    id: exit-code
    attributes:
      label: Código de saída
  - type: textarea
    id: symptom
    attributes:
      label: Sintoma
      description: A mensagem, sem segredos, e o que foi observado.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reprodução
      description: O script ou o comando, com as opções do `Agent` e do `Workspace` e as chaves do `choliba.config.ts` que importam, sem credenciais.
      render: text
  - type: textarea
    id: evidence
    attributes:
      label: Evidências
      description: Trechos do log da sessão, sem segredos, e caminhos relativos à raiz do projeto.
  - type: textarea
    id: expected
    attributes:
      label: Resultado esperado
