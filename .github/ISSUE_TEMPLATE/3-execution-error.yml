name: Erro de execução de agente
description: Uma ocorrência de erro numa execução de agente. Uma issue por erro.
title: '[execution-error] '
labels: ['execution-error', 'bug']
body:
  - type: markdown
    attributes:
      value: >-
        Uma issue por erro. Não cole tokens, credenciais, `.env`, `.env.json`, prompts nem dados pessoais. Para algo
        que não é uma execução de agente, use o template "Relatar um bug".
  - type: input
    id: key
    attributes:
      label: Execução
      description: O log da execução, em `.cache/logs/<agente>/`, relativo à pasta de trabalho.
      placeholder: .cache/logs/test-writer/2026-10-24T10-00-00.000Z-12345-1.log
  - type: dropdown
    id: phase
    attributes:
      label: Fase
      options:
        - preparation
        - provider
        - guard
        - step-after
        - gate-red
        - gate-green
    validations:
      required: true
  - type: input
    id: agent
    attributes:
      label: Agente e versão
      placeholder: test-writer 1.1.3
    validations:
      required: true
  - type: input
    id: provider
    attributes:
      label: Provider, modelo e modo
      placeholder: codex · gpt-6.1-sol · execute
    validations:
      required: true
  - type: dropdown
    id: sandbox
    attributes:
      label: Sandbox
      options:
        - local
        - docker
    validations:
      required: true
  - type: input
    id: target
    attributes:
      label: Projeto e ticket
      placeholder: app · app-1
  - type: input
    id: version
    attributes:
      label: Versão do choliba e commit da pasta de trabalho
      placeholder: 0.0.1-dev.79+f38f044 · 1a2b3c4
    validations:
      required: true
  - type: input
    id: exit-code
    attributes:
      label: Código de saída
  - type: textarea
    id: symptom
    attributes:
      label: Sintoma
      description: A mensagem sanitizada e o que foi observado.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reprodução
      description: O comando e a configuração relevante, sem credenciais.
      render: text
  - type: textarea
    id: evidence
    attributes:
      label: Evidências
      description: Caminhos relativos à pasta de trabalho (log da run, red.md/green.md, trace).
  - type: textarea
    id: expected
    attributes:
      label: Resultado esperado
