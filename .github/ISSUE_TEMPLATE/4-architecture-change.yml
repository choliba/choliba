name: Propor mudança de arquitetura
description: Uma mudança que afeta contratos, módulos ou fronteiras.
title: '[architecture] '
labels: ['architecture']
body:
  - type: textarea
    id: problem
    attributes:
      label: Problema
      description: O problema concreto e o custo atual para mudar, testar ou estender.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposta
      description: A mudança, os módulos de `src/` afetados e as dependências que entram ou saem (A → B = A importa B).
    validations:
      required: true
  - type: checkboxes
    id: compatibility
    attributes:
      label: Compatibilidade
      options:
        - label: Mantém Bun e TypeScript, sem trocar o `bun test`
          required: true
        - label: Sem `any`, e cada capacidade com um dono só (`AGENTS.md`)
          required: true
        - label: As guardas, o sandbox e as permissões continuam valendo igual para todo provider
          required: true
        - label: Mantém os `exports` do `package.json` ou traz a nota de migração
        - label: Cabe em PRs pequenos, cada um com o comportamento igual
  - type: textarea
    id: risks
    attributes:
      label: Riscos e alternativas
    validations:
      required: true
  - type: checkboxes
    id: acceptance
    attributes:
      label: Critérios de aceite
      options:
        - label: '`bun run check` verde e cobertura igual ou maior'
        - label: '`bun run docs:build` verde, com as páginas de `guides/` em dia'
        - label: Os módulos e o `AGENTS.md` (tabela de donos) atualizados
        - label: 'As skills afetadas atualizadas'
