name: Relatar um bug
description: Algo no choliba não funciona como a documentação diz.
title: '[bug] '
labels: ['bug']
body:
  - type: markdown
    attributes:
      value: >-
        Não cole tokens, credenciais, o `.env` nem dados pessoais. Para um erro de uma execução de agente, use o
        template "Erro de execução de agente".
  - type: textarea
    id: what-happened
    attributes:
      label: O que aconteceu
      description: O comando, a saída (sem segredos) e o código de saída.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: O que era esperado
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Como reproduzir
      placeholder: |
        1. bunx choliba …
        2. …
      render: text
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Versão do choliba
      description: O `version` do `package.json` instalado (`bun pm ls choliba`) ou, no código-fonte, `git rev-parse --short HEAD`.
      placeholder: 0.1.0
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: Sistema e Bun
      placeholder: Ubuntu 26.04, bun 1.4.2
