name: Docs

# Avisa o repositório choliba/choliba.github.io para publicar https://choliba.github.io/ a partir de docs/.
# Em cada push na master (cada release), ou à mão. O token DOCS_DISPATCH_TOKEN precisa poder disparar Actions lá.
on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Pedir a publicação do site
        env:
          GH_TOKEN: ${{ secrets.DOCS_DISPATCH_TOKEN }}
        run: |
          gh api --method POST /repos/choliba/choliba.github.io/dispatches \
            -f event_type=publish-docs
