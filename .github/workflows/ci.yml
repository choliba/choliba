name: CI

on:
  pull_request:
    # `edited` é essencial: sem ele, o corpo do PR pode ganhar texto proibido depois
    # do check verde, e nada reprova. Rerodar o job antigo não resolve, porque a
    # execução replaya o payload do evento original, com o corpo antigo.
    types: [opened, synchronize, reopened, edited]
    branches: [develop, master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  pr-text:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      # Título e corpo de PR são texto não confiável: entram só por variável de ambiente.
      - name: Título, corpo, mensagens e autoria dos commits sem rastro de agente/LLM
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          printf '%s\n' "$PR_TITLE" > "$RUNNER_TEMP/pr-title.txt"
          .githooks/commit-msg "$RUNNER_TEMP/pr-title.txt"
          printf '%s\n' "$PR_BODY" > "$RUNNER_TEMP/pr-body.txt"
          .githooks/commit-msg --no-format "$RUNNER_TEMP/pr-body.txt"
          for sha in $(git rev-list --no-merges "$BASE_SHA..$HEAD_SHA"); do
            git log -1 --format=%B "$sha" > "$RUNNER_TEMP/commit-msg.txt"
            echo "commit $sha: $(head -n1 "$RUNNER_TEMP/commit-msg.txt")"
            .githooks/commit-msg "$RUNNER_TEMP/commit-msg.txt"
          done
          # A mensagem não basta: uma identidade proibida no commit pode virar um rodapé no squash do GitHub.
          .githooks/commit-identity "$BASE_SHA..$HEAD_SHA"

  cve:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/setup

      # O bloco do scanner entra só aqui: no bunfig.toml ele abortaria este install.
      - name: CVEs altas ou críticas no lockfile
        run: |
          printf '\n[install.security]\nscanner = "@bun-security-scanner/osv"\n' >> bunfig.toml
          scan="$RUNNER_TEMP/osv-scan.txt"
          set +e
          bun pm scan >"$scan" 2>&1
          status=$?
          set -e
          cat "$scan"
          bun scripts/cve-gate.ts "$scan" "$status"

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/setup
      - run: bun run typecheck

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/setup
      - run: bun run lint

  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/setup
      - run: bun run format

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - name: Instalar o bubblewrap
        run: sudo apt-get update && sudo apt-get install -y bubblewrap
      - run: bun run test:cov

      # A cobertura só pode subir. O limite anterior é o threshold commitado na branch
      # de destino (o ratchet mantém esse valor igual à última cobertura aprovada).
      - name: Cobertura igual ou maior que a da branch de destino
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          base="$RUNNER_TEMP/base-coverage.json"
          if ! git show "origin/$BASE_REF:jest/jest.coverage.config.json" > "$base" 2>/dev/null; then
            echo "A branch $BASE_REF ainda não tem jest/jest.coverage.config.json; nada a comparar."
            exit 0
          fi
          regressions="$(jq -n \
            --slurpfile base "$base" \
            --slurpfile head jest/jest.coverage.config.json \
            --slurpfile cov coverage/coverage-summary.json '
              $base[0].coverageConfig.coverageThreshold.global as $b
              | $head[0].coverageConfig.coverageThreshold.global as $h
              | $cov[0].total as $c
              | ["lines", "statements", "functions", "branches"]
              | map({metric: ., base: $b[.], threshold_no_pr: $h[.], cobertura_no_pr: $c[.].pct})
              | map(select(.threshold_no_pr < .base or .cobertura_no_pr < .base))')"
          if [ "$regressions" != "[]" ]; then
            echo "::error::A cobertura ou o threshold ficou abaixo do da branch $BASE_REF."
            echo "$regressions"
            exit 1
          fi
          echo "Cobertura e thresholds >= aos de $BASE_REF."

      - name: Publicar relatório de cobertura (diagnóstico em caso de falha)
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-report
          path: coverage/
          retention-days: 5

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/setup
      # docs/comandos/ sai do spec. O build reescreve as páginas, então a comparação tem de vir antes: uma página velha falha aqui.
      - run: bun run docs:commands --check
      # O site publicado a partir da master precisa continuar válido em cada PR.
      - run: bun run docs:build

  # O nome deste job é o status check exigido pela proteção das branches.
  check:
    if: always()
    needs: [pr-text, cve, typecheck, lint, format, test, docs]
    runs-on: ubuntu-latest
    steps:
      - name: Conferir todos os gates
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          if jq -e 'all(.[]; .result == "success")' <<< "$RESULTS" > /dev/null; then
            echo "Todos os gates passaram."
            exit 0
          fi
          jq -r 'to_entries[] | select(.value.result != "success") | "::error::\(.key): \(.value.result)"' <<< "$RESULTS"
          exit 1
