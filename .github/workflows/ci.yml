name: CI

on:
  pull_request:
    # `edited` é essencial: sem ele, o corpo do PR pode ganhar texto proibido depois
    # do check verde, e nada reprova. Rerodar o job antigo não resolve, porque a
    # execução replaya o payload do evento original, com o corpo antigo.
    types: [opened, synchronize, reopened, edited]
    branches: [develop, master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  pr-text:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # Título e corpo de PR são texto não confiável: entram só por variável de ambiente.
      - name: Título, corpo, mensagens e autoria dos commits sem rastro de agente/LLM
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          printf '%s\n' "$PR_TITLE" > "$RUNNER_TEMP/pr-title.txt"
          .githooks/commit-msg "$RUNNER_TEMP/pr-title.txt"
          printf '%s\n' "$PR_BODY" > "$RUNNER_TEMP/pr-body.txt"
          .githooks/commit-msg --no-format "$RUNNER_TEMP/pr-body.txt"
          for sha in $(git rev-list --no-merges "$BASE_SHA..$HEAD_SHA"); do
            git log -1 --format=%B "$sha" > "$RUNNER_TEMP/commit-msg.txt"
            echo "commit $sha: $(head -n1 "$RUNNER_TEMP/commit-msg.txt")"
            .githooks/commit-msg "$RUNNER_TEMP/commit-msg.txt"
          done
          # A mensagem não basta: uma identidade proibida no commit pode virar um rodapé no squash do GitHub.
          .githooks/commit-identity "$BASE_SHA..$HEAD_SHA"

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: bun run typecheck

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: bun run lint

  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: bun run format:check

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - name: Instalar o bubblewrap
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap
          # Ubuntu 24.04 bloqueia o user namespace que o bwrap precisa. O runner é descartável.
          if [ "$(sysctl -n kernel.apparmor_restrict_unprivileged_userns 2>/dev/null || echo 0)" = "1" ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      # Os testes do Docker só rodam com a imagem já baixada; sem ela eles pulam e a cobertura cai abaixo do limite.
      - name: Baixar a imagem do Docker dos testes
        run: docker pull oven/bun:latest
      - run: bun run test:cov

      # A cobertura só pode subir. O limite anterior é o coverage-thresholds.json commitado na branch de destino
      # (a catraca mantém esse valor igual à última cobertura aprovada). O test:cov já falha quando a cobertura
      # medida fica abaixo do limite do PR; aqui se confere que o limite do PR não desceu em relação ao da base.
      - name: Limites de cobertura iguais ou maiores que os da branch de destino
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          base="$RUNNER_TEMP/base-thresholds.json"
          if ! git show "origin/$BASE_REF:coverage-thresholds.json" > "$base" 2>/dev/null; then
            echo "A branch $BASE_REF ainda não tem coverage-thresholds.json; nada a comparar."
            exit 0
          fi
          regressions="$(jq -n \
            --slurpfile base "$base" \
            --slurpfile head coverage-thresholds.json '
              ["lines", "functions"]
              | map({metric: ., base: $base[0][.], head: $head[0][.]})
              | map(select(.head < .base))')"
          if [ "$regressions" != "[]" ]; then
            echo "::error::Um limite de cobertura ficou abaixo do da branch $BASE_REF."
            echo "$regressions"
            exit 1
          fi
          echo "Limites de cobertura >= aos de $BASE_REF."

      - name: Publicar relatório de cobertura (diagnóstico em caso de falha)
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-report
          path: coverage/
          retention-days: 5

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      # O site publicado a partir da master precisa continuar válido em cada PR.
      - run: bun run docs:build

  # O nome deste job é o status check exigido pela proteção das branches.
  check:
    if: always()
    needs: [pr-text, typecheck, lint, format, test, docs]
    runs-on: ubuntu-latest
    steps:
      - name: Conferir todos os gates
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          if jq -e 'all(.[]; .result == "success")' <<< "$RESULTS" > /dev/null; then
            echo "Todos os gates passaram."
            exit 0
          fi
          jq -r 'to_entries[] | select(.value.result != "success") | "::error::\(.key): \(.value.result)"' <<< "$RESULTS"
          exit 1
