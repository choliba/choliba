name: Release dev

# Até a primeira versão de produção existe uma release só, a pré-release v0.0.1-dev: cada merge na master
# (o PR de release) move a tag para o novo commit e troca o .tgz e as notas da mesma release, em vez de
# criar outra. Mover a tag com --force é a única exceção ao "sem force-push", que vale para branches.
on:
  push:
    branches: [master]

permissions:
  contents: write

# Dois merges seguidos não disputam a tag: o segundo espera o primeiro terminar.
concurrency:
  group: release-dev
  cancel-in-progress: false

env:
  TAG: v0.0.1-dev

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Ler a versão do Bun em package.json
        id: bun
        run: echo "version=$(jq -r '.packageManager | sub("^bun@"; "")' package.json)" >> "$GITHUB_OUTPUT"

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ steps.bun.outputs.version }}

      - name: Instalar dependências
        run: bun install --frozen-lockfile

      # A tag e o .tgz têm o mesmo nome de versão: uma versão diferente no pacote publicaria um arquivo que
      # o endereço de instalação não acha.
      - name: Versão do pacote igual à da tag
        run: |
          version="$(jq -r .version packages/choliba/package.json)"
          if [ "v$version" != "$TAG" ]; then
            echo "packages/choliba/package.json está em $version, mas a release é $TAG."
            exit 1
          fi

      - name: Empacotar
        run: bun run chol:pack

      - name: Notas da release
        run: |
          previous="$(git rev-parse -q --verify "refs/tags/$TAG^{commit}" || true)"
          range="${previous:+$previous..}HEAD"
          {
            echo 'Pré-release atualizada a cada merge na `master`. Para instalar:'
            echo
            echo '```'
            echo "bun add https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/choliba-${TAG#v}.tgz"
            echo '```'
            echo
            echo '## Desde a atualização anterior'
            echo
            git log --no-merges --format='- %s (%h)' "$range"
          } > "$RUNNER_TEMP/notes.md"
          cat "$RUNNER_TEMP/notes.md"

      - name: Mover a tag para este commit
        run: |
          git tag -f "$TAG" "$GITHUB_SHA"
          git push origin "refs/tags/$TAG" --force

      - name: Atualizar a release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: ${{ env.TAG }}
          prerelease: true
          body_path: ${{ runner.temp }}/notes.md
          files: packages/choliba/choliba-0.0.1-dev.tgz
          overwrite_files: true
