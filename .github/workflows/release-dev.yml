name: Release dev

# Até a primeira versão de produção existe uma release só, a pré-release v0.0.1-dev: cada merge na master
# (o PR de release) move a tag para o novo commit e troca o .tgz e as notas da mesma release, em vez de
# criar outra. Mover a tag com --force é a única exceção ao "sem force-push", que vale para branches.
# As notas trazem o histórico de todas as releases (um merge na master cada), agrupadas por dia: o dia mais recente
# aberto, os anteriores recolhidos, cada uma com os Destaques do PR de release e os commits agrupados por tipo
# (scripts/release-notes.ts).
on:
  push:
    branches: [master]

permissions:
  contents: write
  # Os Destaques: o corpo de cada PR de release.
  pull-requests: read

# Dois merges seguidos não disputam a tag: o segundo espera o primeiro terminar.
concurrency:
  group: release-dev
  cancel-in-progress: false

env:
  TAG: v0.0.1-dev

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Ler a versão do Bun em package.json
        id: bun
        run: echo "version=$(jq -r '.packageManager | sub("^bun@"; "")' package.json)" >> "$GITHUB_OUTPUT"

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ steps.bun.outputs.version }}

      - name: Instalar dependências
        run: bun install --frozen-lockfile

      # A tag e o .tgz têm o mesmo nome de versão: uma versão diferente no pacote publicaria um arquivo que
      # o endereço de instalação não acha.
      # A base de packages/choliba/package.json (0.0.1-dev) é a da tag; cada build é um pré-lançamento SemVer dela com o
      # número da release: quantos merges de release a master tem até aqui (0.0.1-dev.16), contados no git, como nas
      # notas. O commit vai como metadado de build (CHOL_GIT_HEAD), que o --version mostra depois do +.
      - name: Versão deste build
        id: version
        run: |
          base="$(jq -r .version packages/choliba/package.json)"
          if [ "v$base" != "$TAG" ]; then
            echo "packages/choliba/package.json está em $base, mas a release é $TAG."
            exit 1
          fi
          echo "version=$base.$(git rev-list --first-parent --merges --count HEAD)" >> "$GITHUB_OUTPUT"
          echo "date=$(git log -1 --format=%ad --date=short)" >> "$GITHUB_OUTPUT"

      # O endereço de instalação não muda: o .tgz desta versão sobe com o nome fixo da release. O choliba-cli, o
      # assistente que cria uma pasta de trabalho e instala o choliba, sai na mesma release e na mesma versão.
      - name: Empacotar
        env:
          CHOL_VERSION: ${{ steps.version.outputs.version }}
          CHOL_GIT_HEAD: ${{ github.sha }}
        run: |
          bun run chol:pack
          cp "packages/choliba/choliba-$CHOL_VERSION.tgz" "$RUNNER_TEMP/choliba-${TAG#v}.tgz"
          bun run chol:cli:pack
          cp "packages/choliba-cli/choliba-cli-$CHOL_VERSION.tgz" "$RUNNER_TEMP/choliba-cli-${TAG#v}.tgz"

      # Os Destaques de cada release vêm do corpo do PR de release, lido pelo gh.
      - name: Notas da release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bun run release:notes HEAD > "$RUNNER_TEMP/notes.md"
          cat "$RUNNER_TEMP/notes.md"

      - name: Mover a tag para este commit
        run: |
          git tag -f "$TAG" "$GITHUB_SHA"
          git push origin "refs/tags/$TAG" --force

      - name: Atualizar a release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          # O título diz de qual versão são as notas abertas e o .tgz em Assets; a tag é o canal, que não muda.
          name: ${{ steps.version.outputs.version }} (${{ steps.version.outputs.date }})
          prerelease: true
          body_path: ${{ runner.temp }}/notes.md
          files: |
            ${{ runner.temp }}/choliba-0.0.1-dev.tgz
            ${{ runner.temp }}/choliba-cli-0.0.1-dev.tgz
          overwrite_files: true
